<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アレルギーチェッカー</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      background: #fffaf4;
      color: #333;
    }
    h1 { color: #39765b; }
    button, input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 16px 0;
      padding: 14px;
      font-size: 16px;
    }
    button {
      background: #39765b;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    img { max-width: 100%; }
  </style>
</head>
<body>
  <h1>🌿アレルギーチェッカー🌿</h1>
  <p>食品の原材料表示を撮影して、小麦に関係する言葉を確認します。</p>

  <label for="photo">食品表示の写真を選んでね</label>
  <input id="photo" type="file" accept="image/*" capture="environment">

  <button id="check">写真を読み取る</button>
  <div id="result" role="status">ここに結果が表示されます。</div>

  <script>
    const photo = document.getElementById("photo");
    const button = document.getElementById("check");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
  if (!photo.files || !photo.files[0]) {
    result.textContent = "先に食品表示の写真を選んでね。";
    return;
  }

  button.disabled = true;
  result.textContent = "文字を読み取っています。少し待ってね…";

  let worker;

  try {
    worker = await Tesseract.createWorker("jpn");

    const { data } = await worker.recognize(photo.files[0]);
    const text = data.text || "";
    const confidence = data.confidence ?? 0;

    // 空白や改行を除いて検索しやすくする
    const normalized = text.replace(/\s/g, "");

    const terms = [
  "小麦粉",
  "強力粉",
  "薄力粉",
  "中力粉",
  "パン粉",
  "小麦",
  "こむぎ",
  "コムギ",
  "麩"
];

    const found = terms.filter(term =>
      normalized.includes(term)
    );

    let message = "";

    if (text.trim().length === 0) {
      message =
        "⚠️ 文字を読み取れませんでした。\n" +
        "明るい場所で、表示を大きく・正面から撮り直してください。";
    } else if (confidence < 65) {
      message =
        "⚠️ 読み取りの信頼度が低いため、判定できません。\n" +
        "写真を撮り直すか、原材料表示を目で確認してください。\n\n" +
        "小麦の検出語句：" +
        (found.length ? [...new Set(found)].join("、") : "見つかりません") +
        "\n\n読み取り信頼度：" + Math.round(confidence) + "%";
    } else if (found.length > 0) {
      message =
        "🔴 小麦に関係する表示が見つかりました。\n" +
        "原材料表示を確認してください。\n\n" +
        "該当語句：" + [...new Set(found)].join("、") +
        "\n\n読み取り信頼度：" + Math.round(confidence) + "%";
    } else {
      message =
        "🟡 登録した小麦関連語句は見つかりませんでした。\n" +
        "小麦が含まれないことを意味しません。\n" +
        "必ずパッケージの表示を目で確認してください。\n\n" +
        "読み取り信頼度：" + Math.round(confidence) + "%";
    }

    // 読み取った文字を安全にHTML表示できるようにする
    const escapeHTML = (str) =>
      str.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);

    // 検出した語句を長い順に並べる
    const uniqueFound = [...new Set(found)]
      .sort((a, b) => b.length - a.length);

    // まずHTML用に変換してから、対象語句を色付けする
    let highlightedText = escapeHTML(text);

    // 実際に読み取った文字に含まれる対象語句を調べる
    const highlightTerms = terms
      .filter(term => normalized.includes(term))
      .sort((a, b) => b.length - a.length);

    // 小麦粉は「小麦」だけでなく「粉」まで色付けする
    highlightedText = highlightedText.replace(
      /小麦\s*粉/g,
      match =>
        `<mark style="background-color: #ffeb3b; color: #222; padding: 2px 3px; border-radius: 3px; font-weight: bold;">${match}</mark>`
    );

    // 小麦粉以外の対象語句も色付けする
    for (const term of highlightTerms) {
      if (term === "小麦粉") continue;

      // 小麦粉の中の「小麦」を二重に色付けしない
      if (term === "小麦") {
        highlightedText = highlightedText.replace(
          /小麦(?!\s*粉)/g,
          match =>
            `<mark style="background-color: #ffeb3b; color: #222; padding: 2px 3px; border-radius: 3px; font-weight: bold;">${match}</mark>`
        );
        continue;
      }

      const safeTerm = escapeHTML(term);
      highlightedText = highlightedText.split(safeTerm).join(
        `<mark style="background-color: #ffeb3b; color: #222; padding: 2px 3px; border-radius: 3px; font-weight: bold;">${safeTerm}</mark>`
      );
    }

    // 結果メッセージと読み取った文字を表示
    result.innerHTML =
      `<div style="white-space: pre-wrap;">${escapeHTML(message)}</div>` +
      `<h3>読み取った文字（対象語句を黄色で表示）</h3>` +
      `<div style="white-space: pre-wrap; overflow-wrap: anywhere;">${highlightedText}</div>`;

  } catch (error) {
    result.textContent =
      "⚠️ 読み取りに失敗しました。\n" +
      "通信環境や写真を確認して、もう一度試してください。";
  } finally {
    if (worker) {
      await worker.terminate();
    }
    button.disabled = false;
  }
});
  </script>
</body>
</html>
